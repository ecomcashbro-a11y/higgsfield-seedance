name: Generate Seedance Video

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/run-seedance"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate video with Higgsfield API
        env:
          HF_KEY: ${{ secrets.HF_KEY }}
        run: |
          test -n "$HF_KEY" || (echo "Missing repository secret HF_KEY" && exit 1)
          python main.py | tee video-url.txt

      - name: Upload video URL artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seedance-video-url
          path: video-url.txt
